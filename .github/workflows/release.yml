name: Build & Release AniManager (Windows & macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  prepare-release:
    name: Prepare GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create Release if Not Exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes

  build:
    name: Build ${{ matrix.os_label }}
    needs: prepare-release
    if: always() && !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_label: Windows-x64-AllInOne
            asset_name: AniManager-Windows-x64.zip
          - runner: macos-latest
            os_label: macOS-AppleSilicon
            asset_name: AniManager-macOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GUI & Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pystray pillow rich cryptography

      - name: Build All-in-One Package (Windows)
        if: runner.os == 'Windows'
        run: python build_app.py --bundle-core

      - name: Build App Bundle (macOS)
        if: runner.os == 'macOS'
        run: python build_app.py

      - name: Package Release Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/AniManager/*" -DestinationPath "${{ matrix.asset_name }}" -Force

      - name: Package Release Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent AniManager.app "../${{ matrix.asset_name }}"
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_label }}
          path: ${{ matrix.asset_name }}

      - name: Upload Directly to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          gh release upload "$TAG_NAME" "$ASSET_NAME" --clobber